[project]
name = "speakeasy"
version = "0.1.0"
description = "Local Speakwell English practice"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "faster-whisper>=1.2.1,<1.3",
  "httpx>=0.28.1,<0.29",
  "numpy>=2,<3",
  "streamlit>=1.64.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
