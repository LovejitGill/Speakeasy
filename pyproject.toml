[project]
name = "speakeasy"
version = "0.1.0"
description = "Local Speakwell English practice"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "faster-whisper>=1.2.1,<1.3",
  "errant==3.0.2",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "httpx>=0.28.1,<0.29",
  # The Intel macOS PyTorch 2.2.2 wheel uses the NumPy 1.x ABI.
  "numpy>=1.26.4,<2",
  "sentencepiece==0.2.2",
  "spacy==3.8.16",
  "streamlit>=1.64.0",
  "torch==2.2.2",
  "transformers==4.49.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
